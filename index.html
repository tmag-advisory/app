<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="application-name" content="Travel Medicine Advisory Global" />
  <meta name="description" content="Get personalized travel health recommendations based on your destination, medical history, and planned activities. Generate travel health plans in minutes." />
  <meta name="robots" content="index, follow" />

  <!-- Canonical (home) -->
  <link rel="canonical" href="https://travelmedicineadvisory.com/" />

  <!-- Open Graph -->
  <meta property="og:title" content="Travel Medicine Advisory Global — Premium Travel Health Plans" />
  <meta property="og:description" content="Get personalized travel health recommendations based on your destination, medical history, and planned activities. Generate travel health plans in minutes." />
  <meta property="og:url" content="https://travelmedicineadvisory.com/" />
  <meta property="og:image" content="https://travelmedicineadvisory.com/hero-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Travel Medicine Advisory Global" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@TMAGlobal" />
  <meta name="twitter:title" content="Travel Medicine Advisory Global — Premium Travel Health Plans" />
  <meta name="twitter:description" content="Get personalized travel health recommendations based on your destination, medical history, and planned activities." />
  <meta name="twitter:image" content="https://travelmedicineadvisory.com/hero-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="apple-touch-icon" href="/vite.svg" />

  <!-- Resource Hints -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="//app.travelmedicineadvisory.com" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet" />

  <!-- Preload hero image for faster LCP -->
  <link rel="preload" as="image" href="/hero-image.jpg" fetchpriority="high" />

  <!-- Organization & Website JSON-LD Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Travel Medicine Advisory Global",
      "url": "https://travelmedicineadvisory.com",
      "logo": "https://travelmedicineadvisory.com/vite.svg",
      "description": "TMAG uses intelligent technology to consolidate travel health information into personalized, actionable health plans.",
      "foundingDate": "2024",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "support@travelmedicineadvisory.com",
        "url": "https://travelmedicineadvisory.com/contact"
      },
      "sameAs": [
        "https://twitter.com/TMAGlobal",
        "https://linkedin.com/company/travelmedicineadvisory"
      ]
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Travel Medicine Advisory Global",
      "url": "https://travelmedicineadvisory.com",
      "description": "Get personalized travel health recommendations for any destination."
    }
  </script>

  <title>Travel Medicine Advisory Global — Premium Travel Health Plans</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
