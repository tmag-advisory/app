<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" fill="none" role="img" aria-label="Global health risk map">
    <defs>
        <pattern id="dotgrid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
            <circle cx="2" cy="2" r="1.2" fill="#7a6a5a" opacity="0.22" />
        </pattern>
        <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
            <stop offset="0%" stop-color="#c4953a" stop-opacity="0.10" />
            <stop offset="55%" stop-color="#c4953a" stop-opacity="0.03" />
            <stop offset="100%" stop-color="#c4953a" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="continent" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#dccdbd" />
            <stop offset="100%" stop-color="#c4b3a1" />
        </linearGradient>
        <filter id="continentShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
            <feOffset dx="0" dy="6" result="offsetblur" />
            <feComponentTransfer>
                <feFuncA type="linear" slope="0.18" />
            </feComponentTransfer>
            <feMerge>
                <feMergeNode />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="hotspotGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- background dot grid -->
    <rect width="1280" height="720" fill="url(#dotgrid)" />
    <ellipse cx="640" cy="360" rx="560" ry="320" fill="url(#bgGlow)" />

    <!-- latitudinal hairlines -->
    <g stroke="#b0a090" stroke-opacity="0.18" stroke-dasharray="3 8" stroke-width="1">
        <path d="M 60 200 H 1220" />
        <path d="M 60 360 H 1220" />
        <path d="M 60 520 H 1220" />
    </g>

    <!-- continents -->
    <g filter="url(#continentShadow)">
        <!-- North America -->
        <path d="M 120 170 Q 120 110 200 110 L 370 115 Q 430 130 430 195 L 425 330 Q 400 380 320 380 L 200 370 Q 120 360 120 300 Z"
              fill="url(#continent)" stroke="#a09080" stroke-opacity="0.35" stroke-width="1.2" />
        <!-- South America -->
        <path d="M 310 410 Q 310 380 360 380 L 440 390 Q 495 410 485 490 L 460 620 Q 440 670 385 660 L 340 650 Q 295 630 295 575 Z"
              fill="url(#continent)" stroke="#a09080" stroke-opacity="0.35" stroke-width="1.2" />
        <!-- Europe -->
        <path d="M 525 155 Q 525 125 580 125 L 695 135 Q 740 150 730 215 L 710 270 Q 685 295 635 290 L 555 285 Q 525 270 525 230 Z"
              fill="url(#continent)" stroke="#a09080" stroke-opacity="0.35" stroke-width="1.2" />
        <!-- Africa -->
        <path d="M 595 315 Q 595 285 650 285 L 765 300 Q 810 325 800 395 L 775 530 Q 755 585 695 580 L 635 570 Q 590 555 588 510 Z"
              fill="url(#continent)" stroke="#a09080" stroke-opacity="0.35" stroke-width="1.2" />
        <!-- Asia -->
        <path d="M 770 135 Q 770 100 850 100 L 1095 110 Q 1175 125 1185 190 L 1175 360 Q 1145 405 1060 400 L 850 385 Q 770 360 770 305 Z"
              fill="url(#continent)" stroke="#a09080" stroke-opacity="0.35" stroke-width="1.2" />
        <!-- Australia -->
        <path d="M 995 525 Q 995 505 1040 505 L 1140 515 Q 1180 530 1170 585 L 1158 630 Q 1140 660 1095 655 L 1025 650 Q 990 635 990 595 Z"
              fill="url(#continent)" stroke="#a09080" stroke-opacity="0.35" stroke-width="1.2" />
    </g>

    <!-- connection arcs -->
    <g fill="none">
        <path d="M 280 235 Q 640 60 990 240" stroke="#c4953a" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 9" />
        <path d="M 410 510 Q 640 360 730 485" stroke="#2a7a6a" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="6 9" />
        <path d="M 720 415 Q 900 320 1080 350" stroke="#2a7a6a" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 9" />
        <path d="M 1050 590 Q 950 480 770 470" stroke="#c4953a" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="3 9" />
    </g>

    <!-- HIGH risk hotspots (red + halo + label) -->
    <g>
        <!-- South America outbreak -->
        <circle cx="395" cy="510" r="26" fill="#d46a4a" fill-opacity="0.16" filter="url(#hotspotGlow)" />
        <circle cx="395" cy="510" r="14" fill="#d46a4a" fill-opacity="0.28" />
        <circle cx="395" cy="510" r="7" fill="#d46a4a" />
        <line x1="395" y1="510" x2="420" y2="478" stroke="#d46a4a" stroke-opacity="0.6" stroke-width="1.2" />
        <rect x="422" y="460" width="120" height="20" rx="10" fill="#fcf6ef" stroke="#d46a4a" stroke-opacity="0.45" stroke-width="1" />
        <text x="482" y="474" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d2c1e" text-anchor="middle" letter-spacing="0.3">OUTBREAK</text>

        <!-- Africa yellow fever -->
        <circle cx="690" cy="410" r="28" fill="#d46a4a" fill-opacity="0.16" filter="url(#hotspotGlow)" />
        <circle cx="690" cy="410" r="15" fill="#d46a4a" fill-opacity="0.28" />
        <circle cx="690" cy="410" r="7.5" fill="#d46a4a" />
        <line x1="690" y1="410" x2="722" y2="376" stroke="#d46a4a" stroke-opacity="0.6" stroke-width="1.2" />
        <rect x="724" y="358" width="142" height="20" rx="10" fill="#fcf6ef" stroke="#d46a4a" stroke-opacity="0.45" stroke-width="1" />
        <text x="795" y="372" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d2c1e" text-anchor="middle" letter-spacing="0.3">YELLOW FEVER</text>

        <!-- Asia dengue -->
        <circle cx="985" cy="300" r="26" fill="#d46a4a" fill-opacity="0.16" filter="url(#hotspotGlow)" />
        <circle cx="985" cy="300" r="14" fill="#d46a4a" fill-opacity="0.28" />
        <circle cx="985" cy="300" r="7" fill="#d46a4a" />
        <line x1="985" y1="300" x2="1018" y2="266" stroke="#d46a4a" stroke-opacity="0.6" stroke-width="1.2" />
        <rect x="1020" y="248" width="100" height="20" rx="10" fill="#fcf6ef" stroke="#d46a4a" stroke-opacity="0.45" stroke-width="1" />
        <text x="1070" y="262" font-family="Hanken Grotesk, system-ui, sans-serif" font-size="11" font-weight="700" fill="#3d2c1e" text-anchor="middle" letter-spacing="0.3">DENGUE</text>
    </g>

    <!-- MEDIUM risk dots (amber) -->
    <g>
        <circle cx="305" cy="245" r="11" fill="#d4a04a" fill-opacity="0.22" />
        <circle cx="305" cy="245" r="5.5" fill="#d4a04a" />

        <circle cx="730" cy="495" r="11" fill="#d4a04a" fill-opacity="0.22" />
        <circle cx="730" cy="495" r="5.5" fill="#d4a04a" />

        <circle cx="900" cy="195" r="11" fill="#d4a04a" fill-opacity="0.22" />
        <circle cx="900" cy="195" r="5.5" fill="#d4a04a" />
    </g>

    <!-- LOW risk dots (teal-green) -->
    <g>
        <circle cx="245" cy="270" r="10" fill="#4f9e6a" fill-opacity="0.22" />
        <circle cx="245" cy="270" r="5" fill="#4f9e6a" />

        <circle cx="620" cy="215" r="10" fill="#4f9e6a" fill-opacity="0.22" />
        <circle cx="620" cy="215" r="5" fill="#4f9e6a" />

        <circle cx="1080" cy="355" r="10" fill="#4f9e6a" fill-opacity="0.22" />
        <circle cx="1080" cy="355" r="5" fill="#4f9e6a" />

        <circle cx="1090" cy="590" r="10" fill="#4f9e6a" fill-opacity="0.22" />
        <circle cx="1090" cy="590" r="5" fill="#4f9e6a" />
    </g>

    <!-- crosshair compass corner -->
    <g stroke="#a09080" stroke-opacity="0.5" stroke-width="1" fill="none">
        <line x1="1180" y1="60" x2="1220" y2="60" />
        <line x1="1200" y1="40" x2="1200" y2="80" />
        <circle cx="1200" cy="60" r="14" />
    </g>
    <text x="1200" y="32" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="9" font-weight="700" fill="#7a6a5a" text-anchor="middle" letter-spacing="2">N</text>
</svg>
